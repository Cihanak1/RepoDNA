name: RepoDNA Architecture Guardian

on:
  pull_request:
    branches: [main, master]

# Least-privilege security permissions.
# pull_request runs with read-only access to repository contents.
# NEVER use pull_request_target for untrusted PR code execution.
permissions:
  contents: read

jobs:
  guardian:
    name: Architecture Guardian
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 ensures full Git commit history is available to compare base and head revisions
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Base and Head Commits are Available (Fork Safe)
        run: |
          # Guarantees both commit SHAs are available locally, even on shallow checkouts or fork PRs
          git fetch origin ${{ github.event.pull_request.base.sha }}
          git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Install RepoDNA
        run: |
          python -m pip install --upgrade pip
          # Official v0.4.0 release installation from Git tag:
          python -m pip install "git+https://github.com/Cihanak1/RepoDNA.git@v0.4.0"

      - name: Evaluate Pull Request Architecture
        id: guardian
        run: |
          # Use verified, immutable Git commit SHAs from GitHub pull_request event context
          repodna guardian check . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --mode advisory \
            --format markdown \
            --output guardian-report.md
          # To block CI on verified circular dependencies or contract errors, switch '--mode advisory' to '--mode enforce'.

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f guardian-report.md ]; then
            cat guardian-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate Repository Passport
        if: always()
        run: |
          repodna passport generate . --max-modules 200

      - name: Upload Architecture Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repodna-architecture-artifacts
          path: |
            guardian-report.md
            .repodna/passport.json
          retention-days: 14
