name: RepoDNA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.12 — Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: python -m ruff check backend

      - name: Run Mypy Typecheck
        run: python -m mypy backend

      - name: Run Pytest Suite
        run: python -m pytest -v

      - name: Verify CLI Standalone Scanner
        run: python -m repodna.cli.main analyze . --format json --output /tmp/repodna-self.json

      - name: Verify CLI Architecture Guardian and Passport
        run: |
          python -m repodna.cli.main passport generate . --format json --output /tmp/repodna-passport.json
          python -m repodna.cli.main passport validate /tmp/repodna-passport.json
          python -m repodna.cli.main guardian check . --base HEAD --head HEAD --format markdown

  frontend:
    name: Frontend (TypeScript, Vitest, Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

  e2e:
    name: Playwright E2E (Chromium — Live Intelligence & Workstation)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install frontend dependencies & Playwright Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start backend API server daemon
        run: |
          python -m uvicorn repodna.api.app:app --host 127.0.0.1 --port 8000 &
          for i in {1..20}; do
            curl -s http://127.0.0.1:8000/api/health && break || sleep 1
          done

      - name: Start frontend Vite dev server daemon
        working-directory: frontend
        run: |
          npx vite --host 127.0.0.1 --port 5173 &
          for i in {1..20}; do
            curl -s http://127.0.0.1:5173 && break || sleep 1
          done

      - name: Run Playwright Chromium E2E Suite
        working-directory: frontend
        run: |
          npx playwright test e2e/intelligence-workstation.spec.ts e2e/timemachine.spec.ts e2e/advisor.spec.ts --project=chromium

      - name: Upload E2E Design & Workstation Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-workstation-screenshots
          path: docs/design/after/*.png
          if-no-files-found: ignore
