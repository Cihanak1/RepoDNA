name: RepoDNA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.12 — Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: python -m ruff check backend

      - name: Run Mypy Typecheck
        run: python -m mypy backend

      - name: Run Pytest Suite
        run: python -m pytest -v

      - name: Verify CLI Standalone Scanner
        run: python -m repodna.cli.main analyze . --format json --output /tmp/repodna-self.json

      - name: Verify CLI Architecture Guardian and Passport
        run: |
          python -m repodna.cli.main passport generate . --format json --output /tmp/repodna-passport.json
          python -m repodna.cli.main passport validate /tmp/repodna-passport.json
          python -m repodna.cli.main guardian check . --base HEAD --head HEAD --format markdown

  frontend:
    name: Frontend (TypeScript, Vitest, Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build
