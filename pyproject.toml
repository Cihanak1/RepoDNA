[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repodna"
version = "0.5.0"
description = "RepoDNA — Developer Repository Intelligence Platform for architectural graph analysis, circular dependency detection, and explainable rule-based code health reporting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Cihan Akalın", email = "250541107@firat.edu.tr" }
]
keywords = [
    "static-analysis",
    "architecture",
    "dependency-graph",
    "circular-dependencies",
    "tree-sitter",
    "code-health",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "mcp>=2.0.0",
    "PyYAML>=6.0.0",
    "pathspec>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/Cihanak1/RepoDNA"
Repository = "https://github.com/Cihanak1/RepoDNA.git"
Issues = "https://github.com/Cihanak1/RepoDNA/issues"
Changelog = "https://github.com/Cihanak1/RepoDNA/blob/main/CHANGELOG.md"
Security = "https://github.com/Cihanak1/RepoDNA/blob/main/SECURITY.md"

[project.scripts]
repodna = "repodna.cli.main:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"repodna.skills.repodna" = ["*.md", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
strict = false
check_untyped_defs = true
ignore_missing_imports = true
